name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-api:
    name: core-api (Java / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-test-reports
          path: core-api/target/surefire-reports
          if-no-files-found: ignore

  analytics-service:
    name: analytics-service (Python / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analytics-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  frontend:
    name: frontend (React / vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Lint
        run: npm run lint
        continue-on-error: true

  docker-build:
    name: Docker image build sanity check
    runs-on: ubuntu-latest
    needs: [core-api, analytics-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build core-api image
        run: docker build -t ledger-core-api:ci ./core-api

      - name: Build analytics-service image
        run: docker build -t ledger-analytics-service:ci ./analytics-service

      - name: Build frontend image
        run: docker build -t ledger-frontend:ci ./frontend
