name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-api:
    name: core-api (Java / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-test-reports
          path: core-api/target/surefire-reports
          if-no-files-found: ignore

  analytics-service:
    name: analytics-service (Python / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analytics-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  frontend:
    name: frontend (React / vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the committed
      # lockfile, so CI cannot silently pass against different dependency
      # versions than a developer resolved locally.
      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Lint
        run: npm run lint
        continue-on-error: true

  # The gate that matters most: the unit suites all pass against mocks and H2,
  # but every defect listed in README's "Verification status" section was one
  # only a real stack could expose - RBAC through the actual filter chain,
  # Flyway against real Postgres, the JWT crossing a language boundary, and
  # whether the generated PDF/XLSX bytes are valid documents.
  end-to-end:
    name: end-to-end (docker compose + smoke test)
    runs-on: ubuntu-latest
    needs: [core-api, analytics-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create a .env with generated secrets
        run: |
          cp .env.example .env
          # Distinct app and read-only passwords, so a mix-up cannot pass unnoticed.
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          sed -i "s|^CONNECTOR_ENCRYPTION_KEY=.*|CONNECTOR_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-app-$(openssl rand -hex 8)|" .env
          sed -i "s|^ANALYTICS_DB_PASSWORD=.*|ANALYTICS_DB_PASSWORD=ci-readonly-$(openssl rand -hex 8)|" .env

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: Show service status
        run: docker compose ps

      - name: Run the end-to-end smoke test
        run: python scripts/e2e-smoke-test.py

      - name: Verify the read-only role cannot reach the token store
        run: |
          set -eu

          # Read the values out of .env literally. Do NOT `source` it: .env is a
          # docker-compose env file, not a shell script, so a value containing
          # spaces (REPORTS_CRON=0 0 2 1 * *) is parsed as an assignment followed
          # by a command, which exits 127 and fails the step.
          env_value() { grep -E "^$1=" .env | head -1 | cut -d= -f2-; }

          DB_NAME="$(env_value DB_NAME)"
          RO_USER="$(env_value ANALYTICS_DB_USER)"
          RO_PASSWORD="$(env_value ANALYTICS_DB_PASSWORD)"

          # PGPASSWORD plus discrete flags rather than a connection URI, so a
          # password containing URI-significant characters needs no escaping.
          ro_psql() {
            docker compose exec -T -e PGPASSWORD="$RO_PASSWORD" postgres \
              psql -h 127.0.0.1 -U "$RO_USER" -d "$DB_NAME" -tAc "$1"
          }

          # Must succeed: analytics genuinely needs to read the ledger.
          ro_psql 'SELECT count(*) FROM transactions' > /dev/null
          echo "ok: ledger_readonly can read transactions"

          # Must all fail. A migration regression here would silently hand the
          # analytics role the encrypted OAuth tokens, the report documents, or
          # every user's bcrypt password hash.
          #
          # app_user is on this list because omitting it is exactly how the
          # password_hash grant survived V6: the check enumerated the tables
          # someone had already thought about.
          for table in connector_credential report_run fraud_alert app_user; do
            if ro_psql "SELECT 1 FROM ${table} LIMIT 1" > /dev/null 2>&1; then
              echo "FAIL: ledger_readonly can read ${table}"
              exit 1
            fi
            echo "ok: ledger_readonly denied on ${table}"
          done

          if ro_psql 'DELETE FROM transactions' > /dev/null 2>&1; then
            echo "FAIL: ledger_readonly can write to transactions"
            exit 1
          fi
          echo "ok: ledger_readonly denied write access"

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
