server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # config.js is rewritten at container start, so it must never be cached -
    # a stale copy would point the app at the wrong backend.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA fallback so client-side routes (e.g. /transactions, /connectors/callback)
    # resolve on refresh and on the OAuth redirect back from a provider.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
