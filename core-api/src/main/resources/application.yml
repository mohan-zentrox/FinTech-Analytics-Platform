server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ledger-core-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger}
    username: ${DB_USER:ledger_app}
    password: ${DB_PASSWORD:ledger_app_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# HS256 key must be >= 32 bytes. Override JWT_SECRET in every non-local environment (.env.example).
jwt:
  secret: ${JWT_SECRET:change-this-local-dev-only-secret-please-0123456789abcdef}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.zentrox.ledger: INFO
