# Local/demo stack: postgres + all three services.
# `version:` is intentionally omitted - it has been obsolete since Compose v2
# and only produced a warning on every invocation.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ledger}
      POSTGRES_USER: ${DB_USER:-ledger_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-ledger-app-password}
    ports:
      - "5432:5432"
    volumes:
      - ledger_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ledger_app} -d ${DB_NAME:-ledger}"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build:
      context: ./core-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ledger}
      DB_USER: ${DB_USER:-ledger_app}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-ledger-app-password}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-base64-string-before-deploying}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      # core-api's V2 migration provisions the ledger_readonly role with exactly
      # this password, so analytics-service below can authenticate. Both services
      # read the same variable - that is the point.
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-change-me-ledger-readonly-password}
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:-local-dev-only-connector-key-0123456789abcdef}
      REPORTS_SCHEDULE_ENABLED: ${REPORTS_SCHEDULE_ENABLED:-true}
      CONNECTORS_SANDBOX: ${CONNECTORS_SANDBOX:-true}
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build:
      context: ./analytics-service
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ledger}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-ledger_readonly}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-change-me-ledger-readonly-password}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
      # Must match core-api: analytics endpoints now verify the same HS256 JWT.
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-base64-string-before-deploying}
    depends_on:
      # Waits for core-api to be *healthy*, not merely started: core-api's Flyway
      # migrations are what create the ledger_readonly role and its grants, and
      # `service_started` used to let this service race ahead of them.
      core-api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CORE_API_BASE_URL: ${VITE_CORE_API_BASE_URL:-http://localhost:8080/api}
        VITE_ANALYTICS_API_BASE_URL: ${VITE_ANALYTICS_API_BASE_URL:-http://localhost:8000/analytics}
    ports:
      - "5173:80"
    depends_on:
      - core-api
      - analytics-service

volumes:
  ledger_postgres_data:
